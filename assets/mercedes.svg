<?xml version="1.0" encoding="UTF-8"?>
<!-- Mercedes star — geometric, drawn (not a trademark download).
     Outer circle + inner circle + 3 spokes at 120°. Monochrome light grey.
     Red variant is tinted at runtime (QColor). Vector, crisp at any zoom. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <circle cx="50" cy="50" r="46" fill="none" stroke="#C8C8CC" stroke-width="1.6"/>
  <circle cx="50" cy="50" r="38" fill="none" stroke="#C8C8CC" stroke-width="1.1"/>
  <!-- star: up (-90°), down-right (30°), down-left (150°) -->
  <line x1="50" y1="50" x2="50" y2="8" stroke="#C8C8CC" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="86.4" y2="71" stroke="#C8C8CC" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="13.6" y2="71" stroke="#C8C8CC" stroke-width="1.6" stroke-linecap="round"/>
</svg>
